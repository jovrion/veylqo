# CI for the Go module and the work board.
# Dev tools are installed in the job. They are not module dependencies
# (ADR-0003): no tool directive, no go get into go.mod.

name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          # go.sum is the lockfile for the two driver requires (ADR-0003).
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            printf '%s\n' "$unformatted"
            echo "gofmt -l: files above are not formatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: work-validate
        run: make work-validate

      - name: Install golangci-lint
        # Binary release. go install / go get / tool would couple the
        # linter to the module, which ADR-0003 forbids.
        run: curl -sSfL https://golangci-lint.run/install.sh | sh -s -- -b "$(go env GOPATH)/bin" v2.15.0

      - name: golangci-lint
        run: golangci-lint run

      - name: Install govulncheck
        # go install pkg@version does not edit the current module.
        # The temp directory keeps the install out of this go.mod.
        run: |
          cd "$(mktemp -d)"
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0

      - name: govulncheck
        run: govulncheck ./...

      - name: module files are unchanged
        run: |
          if grep -n '^tool ' go.mod; then
            echo "tool directive is forbidden (ADR-0003)"
            exit 1
          fi
          # go.sum is committed with the driver requires. CI must not
          # create it or rewrite it; a missing lockfile is also a failure.
          if [ ! -f go.sum ]; then
            echo "go.sum is missing; driver requires need a committed lockfile"
            exit 1
          fi
          git diff --exit-code -- go.mod go.sum

  # ADR-0005: a laptop run may skip Postgres. This job is the run that
  # claims the adapter suite executed, so it must provide the DSN.
  # The password matches the Compose placeholder. It is not a production
  # secret. Do not print VEYLQO_TEST_PG_DSN.
  postgres:
    name: postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: veylqo
          POSTGRES_PASSWORD: veylqo
          POSTGRES_DB: veylqo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U veylqo -d veylqo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 5s
    env:
      # 127.0.0.1, not localhost: the service port is IPv4 on the runner.
      VEYLQO_TEST_PG_DSN: postgres://veylqo:veylqo@127.0.0.1:5432/veylqo?sslmode=disable
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: postgres adapter tests
        run: |
          if [ -z "${VEYLQO_TEST_PG_DSN:-}" ]; then
            echo "VEYLQO_TEST_PG_DSN is unset"
            exit 1
          fi
          set +e
          out=$(go test ./internal/links/adapters/ -count=1 -run 'Postgres' -v)
          test_status=$?
          set -e
          printf '%s\n' "$out"
          if [ "$test_status" -ne 0 ]; then
            exit "$test_status"
          fi
          if printf '%s\n' "$out" | grep -E -q '^--- SKIP:'; then
            echo "postgres adapter tests skipped"
            exit 1
          fi
          printf '%s\n' "$out" | grep -q '^--- PASS: TestPostgresRepository '
          printf '%s\n' "$out" | grep -q '^--- PASS: TestPostgresStoresIDAsUUID '
